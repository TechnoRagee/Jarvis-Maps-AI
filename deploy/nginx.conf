# Nginx configuration for Jarvis Maps AI Web Portal & Licensing Gateway
# Place in /etc/nginx/sites-available/jarvismaps and symlink to sites-enabled

server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /opt/jarvismaps/Website;
    index index.html;

    # Performance & Resumable Downloads (411 MB setup installer)
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    client_max_body_size 50M;

    # Enable byte-range support for interrupted/resumable downloads
    location ~* \.(exe|zip|iso)$ {
        sendfile on;
        sendfile_max_chunk 1m;
        tcp_nopush on;
        add_header Accept-Ranges bytes;
        add_header Cache-Control "public, max-age=86400";
    }

    # Public static website assets
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy License & Security API to Python Daemon (Port 8081)
    location /api/ {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Disable buffering for instant streaming responses
        proxy_buffering off;
        proxy_read_timeout 30s;
        proxy_connect_timeout 5s;
    }

    # Block direct web access to sensitive databases, configs, and logs
    location ~* \.(db|json|key|env|py|log|vault|bak)$ {
        deny all;
        return 404;
    }

    # Block access to hidden dotfiles
    location ~ /\. {
        deny all;
        return 404;
    }
}
